<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>广告投放分析平台 MVP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>广告投放分析平台 MVP</h1>
      <p class="subtitle">工作流：整体效果 -> 异常指标 -> 异常原因</p>
    </header>

    <section class="filters">
      <label>
        粒度
        <select id="granularity">
          <option value="day">日</option>
          <option value="week">周</option>
          <option value="month">月</option>
        </select>
      </label>
      <label>
        开始日期
        <input id="date-from" type="date" value="2026-04-01" />
      </label>
      <label>
        结束日期
        <input id="date-to" type="date" value="2026-04-21" />
      </label>
      <button id="apply-filter" type="button">应用筛选</button>
      <span id="data-status" class="status">数据状态：未加载</span>
    </section>

    <nav class="tabs">
      <a href="#/overview" data-route="overview">总览</a>
      <a href="#/diagnosis" data-route="diagnosis">分维诊断</a>
      <a href="#/experiments" data-route="experiments">A/B 测试</a>
    </nav>

    <main id="app"></main>

    <script src="./app.js" defer></script>
  </body>
</html>
